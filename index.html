<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooldown Tracker</title>
<style>
body{font-family:Arial,sans-serif;max-width:800px;margin:auto;padding:15px;background:#f5f5f5}
.card{background:white;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
input{padding:6px;margin:3px}
input[type=text]{width:180px}
input[type=number]{width:70px}
button{padding:8px 10px;margin:4px;cursor:pointer}
.skill{border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:10px}
.turn{text-align:center;font-size:1.4em;font-weight:bold}
.ready{color:#2e7d32;font-weight:bold}
.cooldown{color:#c62828;font-weight:bold}
.barra{font-family:monospace;font-size:1.2em;letter-spacing:1px;margin:6px 0}
.verde{color:#2e7d32}.amarillo{color:#f9a825}.rojo{color:#c62828}
.actions{text-align:center}
</style>
</head>
<body>

<div class="card">
<h2>Configuración</h2>

<p>Personaje:
<input type="text" id="characterName" placeholder="Nombre del personaje">
</p>

<p><input type="text" id="name1" placeholder="Habilidad 1"> CD:
<input type="number" id="max1" min="0" value="0"></p>

<p><input type="text" id="name2" placeholder="Habilidad 2"> CD:
<input type="number" id="max2" min="0" value="0"></p>

<p><input type="text" id="name3" placeholder="Habilidad 3"> CD:
<input type="number" id="max3" min="0" value="0"></p>

<p>Definitiva:
<select id="ultimateMax">
<option value="0">No tiene</option>
<option value="8">8 cargas</option>
<option value="16">16 cargas</option>
</select>
</p>

<div class="actions">
<button onclick="guardarConfiguracion()">Guardar / Cambiar Personaje</button>
</div>
</div>

<div class="card">
<h2 id="personajeTitulo">Sin personaje</h2>

<div class="turn">
Turno: <span id="turno">0</span>
</div>

<div id="skills"></div>

<div id="ultimateSection"></div>

<div class="actions">
<button onclick="siguienteTurno()">Empieza mi turno</button>
<button onclick="deshacerAccion()">Deshacer acción</button>
<button onclick="reiniciarCooldowns()">Reiniciar cooldowns</button>
</div>
</div>

<script>
let estado={
personaje:"",
turno:0,
ultimoEstado:null,
habilidades:[
{nombre:"Habilidad 1",max:0,actual:0},
{nombre:"Habilidad 2",max:0,actual:0},
{nombre:"Habilidad 3",max:0,actual:0}
],
definitiva:{max:0,actual:0}
};

function clonarEstado(){
return {
turno: estado.turno,
habilidades: structuredClone(estado.habilidades),
definitiva: structuredClone(estado.definitiva)
};
}

function guardarEstado(){
const datos={
personaje:estado.personaje,
habilidades:estado.habilidades.map(h=>({
nombre:h.nombre,
max:h.max
})),
definitiva:{
max:estado.definitiva.max
}
};
localStorage.setItem("cooldownTracker",JSON.stringify(datos));
}

function guardarUltimoEstado(){
estado.ultimoEstado=clonarEstado();
}

function crearBarra(actual,max){
if(max===0) return "";
let r="";
for(let i=0;i<max;i++) r += i<actual ? "■":"□";
return r;
}

function colorBarra(actual,max){
if(actual===0) return "verde";
let p=(actual/max)*100;
if(p>=66) return "rojo";
if(p>=33) return "amarillo";
return "verde";
}

function cargarEstado(){
const g=localStorage.getItem("cooldownTracker");

if(g){
const datos=JSON.parse(g);

estado.personaje=datos.personaje||"";
estado.habilidades=(datos.habilidades||estado.habilidades).map(h=>({
nombre:h.nombre,
max:h.max,
actual:0
}));
estado.definitiva={
max:datos.definitiva?.max||0,
actual:0
};
estado.turno=0;
estado.ultimoEstado=null;
}

characterName.value=estado.personaje||"";
name1.value=estado.habilidades[0].nombre;
name2.value=estado.habilidades[1].nombre;
name3.value=estado.habilidades[2].nombre;
max1.value=estado.habilidades[0].max;
max2.value=estado.habilidades[1].max;
max3.value=estado.habilidades[2].max;
ultimateMax.value=estado.definitiva.max;

render();
}

function guardarConfiguracion(){

if(!confirm("¿Seguro? Se reiniciarán turno, cooldowns y definitiva.")) return;

estado.personaje=characterName.value||"Personaje";
estado.turno=0;
estado.ultimoEstado=null;

estado.habilidades=[
{nombre:name1.value||"Habilidad 1",max:Number(max1.value),actual:0},
{nombre:name2.value||"Habilidad 2",max:Number(max2.value),actual:0},
{nombre:name3.value||"Habilidad 3",max:Number(max3.value),actual:0}
];

estado.definitiva={
max:Number(ultimateMax.value),
actual:0
};

guardarEstado();
render();
}

function usarHabilidad(i){
if(estado.habilidades[i].actual!==0) return;
guardarUltimoEstado();
estado.habilidades[i].actual=estado.habilidades[i].max;
guardarEstado(); render();
}

function siguienteTurno(){
guardarUltimoEstado();
estado.turno++;
estado.habilidades.forEach(h=>{
if(h.actual>0) h.actual--;
});
guardarEstado(); render();
}

function reiniciarCooldowns(){
guardarUltimoEstado();
estado.habilidades.forEach(h=>h.actual=0);
guardarEstado(); render();
}

function deshacerAccion(){
if(!estado.ultimoEstado) return;

estado.turno=estado.ultimoEstado.turno;
estado.habilidades=structuredClone(estado.ultimoEstado.habilidades);
estado.definitiva=structuredClone(estado.ultimoEstado.definitiva);

estado.ultimoEstado=null;
render();
}

function añadirCarga(c){
if(estado.definitiva.max===0) return;
guardarUltimoEstado();
estado.definitiva.actual=Math.min(
estado.definitiva.actual+c,
estado.definitiva.max
);
guardarEstado(); render();
}

function lanzarDefinitiva(){
guardarUltimoEstado();
estado.definitiva.actual=0;
guardarEstado(); render();
}

function render(){

turno.textContent=estado.turno;
personajeTitulo.textContent=estado.personaje||"Sin personaje";

let html="";

estado.habilidades.forEach((h,i)=>{
const disponible=h.actual===0;

html+=`
<div class="skill">
<h3>${h.nombre}</h3>

<p class="${disponible?'ready':'cooldown'}">
Cooldown: ${h.actual}/${h.max}
</p>

${h.max>0?
`<div class="barra ${colorBarra(h.actual,h.max)}">
${crearBarra(h.actual,h.max)}
</div>`:''}

<p>
${disponible
?'Disponible'
:`Disponible en ${h.actual} turno${h.actual!==1?'s':''}`}
</p>

<button onclick="usarHabilidad(${i})"
${!disponible?'disabled':''}>
Usar habilidad
</button>
</div>`;
});

skills.innerHTML=html;

let ult="";

if(estado.definitiva.max>0){

const a=estado.definitiva.actual;
const m=estado.definitiva.max;

ult+=`
<div class="skill">
<h3>Definitiva</h3>

<p><strong>${a}/${m}</strong></p>

<div class="barra ${colorBarra(a,m)}">
${crearBarra(a,m)}
</div>

<button onclick="añadirCarga(1)">+1</button>
<button onclick="añadirCarga(2)">+2</button>
<button onclick="añadirCarga(3)">+3</button>
`;

if(m===8){

if(a>=8){
ult+=`<p class="ready">Lista para usar</p>
<button onclick="lanzarDefinitiva()">Lanzar Definitiva</button>`;
}else{
ult+=`<p>Faltan ${8-a} cargas</p>`;
}

}else{

if(a>=8){
ult+=`<p class="ready">Definitiva disponible</p>
<button onclick="lanzarDefinitiva()">Lanzar Definitiva</button>`;
}else{
ult+=`<p>Faltan ${8-a} cargas para la Definitiva</p>`;
}

if(a>=16){
ult+=`<p class="ready">Definitiva Mejorada disponible</p>
<button onclick="lanzarDefinitiva()">Lanzar Definitiva Mejorada</button>`;
}else{
ult+=`<p>Faltan ${16-a} cargas para la Mejorada</p>`;
}
}

ult+=`</div>`;
}

ultimateSection.innerHTML=ult;
}

cargarEstado();
</script>
</body>
</html>
